[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticktest-mcp"
version = "0.4.0"
description = "TickTest A股量化回测 MCP Server — 让 AI Agent 用自然语言回测 A 股"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "TickTest Team", email = "hello@ticktest.cn"},
]
keywords = ["mcp", "ticktest", "backtest", "a-stock", "quant", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://ticktest.cn"
Documentation = "https://ticktest.cn/docs"
Repository = "https://github.com/ticktest/ticktest-mcp"

[project.scripts]
ticktest-mcp = "ticktest_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ticktest_mcp"]
